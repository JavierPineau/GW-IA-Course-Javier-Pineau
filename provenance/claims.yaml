  - id: scenario-history-and-exclusions
    statement: >
      Historia, no resultados reproducidos: los diagnósticos antiguos de CL7 sobre variación de ln H,
      acumulación en las últimas diez e-folds y diferencia epsilonV/epsilonH no tienen un barrido conservado
      que establezca su causa. El escenario 2 está implementado pero excluido del análisis publicado;
      los problemas descritos corresponden a la formulación de continuidad ensayada en doble precisión,
      no excluyen variables reescaladas o logarítmicas. La alternativa 1/c_s es una hipótesis no derivada.
    evidence:
      - codigo/background_leon.py::eps1_tanh
      - codigo/run_leon.py::scenarios
      - "provenance/PROVENANCE.md sección 14: historia de decisiones; no ejecución certificada"
    numbers: []
    status: historical_or_conjectural

  - id: aux-background-system
    statement: 'Sistema de fondo fenomenológico: 3 MP² H²=rho+Q+Lambda0 MP² y -2 MP² Hdot=rho+p, con continuidad
      rho_dot+3H(rho+p)=-Qdot. Para un escalar canónico se impone la transferencia al inflatón. Una acción
      canónica conservativa por sí sola no produce Q variable.'
    hypotheses:
    - FLRW plano
    - tensor de materia canónico usado fenomenológicamente
    - Q(N) prescrita en la trayectoria
    evidence:
    - codigo/background.py::quantities_ug
    - derivation/derivation.md sección 2; León arXiv:2202.04029 ecuaciones 9–12
    numbers: []
  - id: aux-action-state-normalization
    statement: La amplitud usa como hipótesis efectiva S_T=MP²/8 integral a³[hdot²-(grad h)²/a²], v=a MP
      h/sqrt(2), e_ij e_ij=2 y estado inicial adiabático de Bunch–Davies a q finito. La ecuación TT lineal
      no fija por sí sola esa normalización. El vínculo a segundo orden requiere completar la métrica lineal
      o usar g_ij=a²(exp h)_ij, tr h=0.
    hypotheses:
    - materia sin parte TT a primer orden
    - acción tensorial efectiva estándar
    - no se especifica acción completa de intercambio de energía
    evidence:
    - codigo/modes.py::bunch_davies_ic
    - codigo/modes.py::tensor_power
    - derivation/derivation.md secciones 3–4; informe/s07_espectro.tex
    numbers: []
  - id: aux-scalar-identity
    statement: Para el tensor canónico, div T=(Box phi-Vprime) grad phi. Q es localmente función del campo
      donde grad phi no se anula. La condición delta Q=0 con perturbación espacial no uniforme impone la
      restricción ensayada; no abarca todos los gauges ni perturbaciones uniformes.
    hypotheses:
    - campo canónico
    - identidad local
    - ansatz escalar sin E en la verificación simbólica
    evidence:
    - codigo/symbolic_checks.py::check_divergence_identity
    - codigo/symbolic_checks.py::check_dQ_constraint
    numbers: []
  - id: aux-standard-predictions
    statement: 'Referencias estándar: de Sitter a tiempo finito P_T=2H²/(pi² MP²)(1+q²); límite q→0 y slow-roll
      tensorial; r≈16 epsilon1 y ns≈1-2 epsilon1-epsilon2 usan el sector escalar estándar de RG. Para cuadrático
      r≈8/N*, para Starobinsky r≈12/N*² y ns≈1-2/N*, a orden dominante y N* grande.'
    hypotheses:
    - acción tensorial y vacío estándar
    - slow-roll donde corresponda
    - predicciones escalares de RG; su uso en UG es condicional
    evidence:
    - codigo/checks.py::check_de_sitter_exact
    - codigo/checks.py::check_planck_phi2
    - codigo/checks.py::check_planck_starobinsky
    - Martin et al. arXiv:1303.3787v3, ecuaciones 2.19, 2.23, 2.24; informe/s07_espectro.tex
    numbers: []

