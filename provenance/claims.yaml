# Afirmaciones del trabajo y lo que las respalda (formato del curso, día 5). Rutas relativas a la raíz del repositorio.
# Cada `numbers` existe en numbers.json (lo verifica provenance/validate_provenance.py y codigo/test_provenance.py).
claims:
  - id: tt-equation-same-as-gr
    statement: >
      Sobre un fondo FLRW plano, en UG con difusión Q la ecuación de los modos tensoriales (transversos sin traza) a primer orden es la de RG,
      d²h/dt² + 3H dh/dt + k²h/a² = 0 (t es tiempo cósmico); Q entra solo a través de H(t). Vale mientras la materia no aporte parte TT.
    evidence:
      - codigo/symbolic_checks.py::check_tt_equation
      - codigo/checks.py::check_negative_control
      - "derivation/derivation.md, Secs. 3.5-3.7 y 4 (derivación a mano; la acción a segundo orden NO está verificada simbólicamente)"
    numbers: [symbolic_tt_equation_passed]
  - id: code-reproduces-gr-limit
    statement: >
      El código de modos reproduce el límite estándar de RG: de Sitter exacto, desarrollo de slow-roll a segundo orden y las predicciones del
      potencial cuadrático; UG con gamma = 0 es RG exacta; y un integrador independiente coincide.
    evidence:
      - codigo/checks.py::check_de_sitter_exact
      - codigo/checks.py::check_slow_roll_rg
      - codigo/checks.py::check_planck_phi2
      - codigo/checks.py::check_conservative_limit
      - codigo/checks.py::check_independent_cosmic_time
      - "Martin, Ringeval, Vennin, arXiv:1303.3787v3, Eqs. 2.19, 2.23, 2.24"
    numbers: [check_deSitter_worst_rel_err, check_UG_gamma0_vs_RG, check_independent_integrator]
  - id: ug-rg-difference-from-background
    statement: >
      En el modelo de un inflatón con Q(N) = Q_i exp(-gamma N) prescripta, la diferencia entre P_T de UG y de RG no es ruido numérico y se explica
      por el fondo H(t) de UG (el cociente numérico coincide con la fórmula estándar evaluada con el fondo de UG).
    evidence:
      - codigo/checks.py::check_ug_vs_rg_difference
      - codigo/checks.py::check_negative_control
    numbers: [check_signal_over_noise_quad, quad_ratio_equal_k_first, quad_ratio_equal_k_last]
  - id: sign-depends-on-criterion
    statement: >
      Con el potencial cuadrático, el signo de P_T^UG/P_T^RG - 1 (supresión frente a aumento) depende del criterio de comparación: a igual k comóvil UG suprime P_T,
      a igual número de e-folds antes del final de cada inflación lo aumenta (convención ilustrativa: no equivale a igual escala observacional; falta el recalentamiento). Por eso "UG suprime P_T" no es una propiedad robusta de UG.
    evidence:
      - codigo/compare_potentials.py::main
      - codigo/run_spectrum.py::main
    numbers: [quad_ratio_equal_k_first, quad_ratio_equal_k_last, quad_ratio_equal_Nstar_50, quad_ratio_equal_Nstar_60, quad_phi_i, quad_Nend_RG]
  - id: starobinsky-effect-small
    statement: >
      Con el potencial de Starobinsky (misma prescripción de Q) el efecto de UG sobre P_T es de ~10 % (0.90 a igual N*; entre 0.947 y 0.796 a igual k), y las diferencias de n_T
      son < 3.1e-4 (no se evaluó su detectabilidad instrumental); el presupuesto energético no aísla la causa del final ni descarta la contribución de Lambda_0.
    evidence:
      - codigo/compare_potentials.py::compare
      - codigo/checks.py::check_planck_starobinsky
      - "informe/s10_potenciales.tex, subsecciones 10.2 y 10.4"
    numbers: [staro_phi_i, staro_Nend_RG, staro_M_calibrated, staro_ratio_equal_Nstar_50, staro_ratio_equal_Nstar_60, staro_ratio_equal_k_first, staro_ratio_equal_k_last]
  - id: single-scalar-implies-veff
    statement: >
      Para un escalar canónico con el tensor energía-impulso usado, la difusión es localmente (donde grad phi != 0) función del campo, Q = Q(phi), y
      con Q(phi) fijada como ley del modelo las ecuaciones de UG son las de RG con el potencial efectivo V + Q(phi) + Lambda_0 M_P^2 (fondo: verificado
      simbólicamente; perturbaciones: argumentado a mano). Con Q(N) reconstruida sobre una trayectoria monótona esto vale solo sobre esa rama. Si se impone
      delta Q = 0 en el marco especificado y la perturbación del inflatón es inhomogénea (grad delta phi != 0), resulta E_0 = 0 y Qdot = 0; NO cubre
      perturbaciones uniformes (grad delta phi = 0) ni otros gauges (delta Q no es invariante de gauge). No es una equivalencia irrestricta de teorías ni
      una prohibición general de que un inflatón intercambie energía con Q.
    evidence:
      - codigo/symbolic_checks.py::check_divergence_identity
      - codigo/symbolic_checks.py::check_background_closure
      - codigo/symbolic_checks.py::check_dQ_constraint
      - "informe/s11_acoplamiento.tex (la equivalencia a nivel de las perturbaciones escalares completas se argumenta a mano; no está verificada simbólicamente)"
    numbers: [symbolic_divergence_identity_passed, symbolic_background_closure_passed, symbolic_dQ_constraint_passed]
  - id: leon-background-pt-is-gr
    statement: >
      Con el modelo de radiación con difusión Q (arXiv:2202.04029; arXiv:2307.06329) (radiación pura y Q, sin inflatón, delta Q = 0), P_T depende solo de H(N) y eps1(N): coincide con el de un inflatón de RG
      cuyo potencial se reconstruye para reproducir el mismo H(N).
    evidence:
      - codigo/checks_leon.py::check_rg_inflaton_equivalence
      - codigo/checks_leon.py::check_continuity_path
      - codigo/checks_leon.py::check_closed_forms_A2
      - "León, arXiv:2202.04029, Eqs. 9, 16, 18, 32-33; Piccirilli y León, arXiv:2307.06329, Eqs. 44, 46-48"
    numbers: [leon_RGrec_max_dlnH, leon_P_T_Nstar57, leon_nT_Nstar57]
  - id: leon-reference-point-As
    statement: >
      En el punto de referencia de A2 (escenario 1, gamma = 2.02, N_f = 100, rho_end = 1e-11, N* = 57) la fórmula escalar de A2 da A_s a +1.0816% de
      Planck sin ajustar parámetros; con el factor 3^{3/2} de la Eq. 66 de A1 daría 5.2 veces más. Esto NO establece cuál fórmula es correcta: el sector
      escalar no está derivado y los parámetros de A2 se eligieron con su fórmula.
    evidence:
      - codigo/checks_leon.py::check_A2_reference_point
      - codigo/run_leon.py::main
      - "Piccirilli y León, arXiv:2307.06329, Eq. 41 y Sec. IV.A"
    numbers: [leon_A_s_A2_Nstar57, leon_A_s_A1_Nstar57, leon_r_A2_Nstar57, leon_As_gamma1p5_Nstar60]
  - id: leon-slowroll-mapping-offset
    statement: >
      CL7 compara la razón P_T(N*=60)/P_T(N*=50), no toda la forma. Los offsets absolutos son de 23–29%.
      El criterio inicial absoluto de 10% falló; el posterior de 3% para la razón es exploratorio.
      No se atribuye una causa exclusiva al offset con el diagnóstico conservado.
    evidence:
      - codigo/checks_leon.py::check_slowroll_map_vs_rg
      - "provenance/PROVENANCE.md sec. 14 (el criterio original de 10 % falló y se reemplazó; declarado)"
    numbers: [leon_mapping_offset_quadratic_Nstar60, leon_mapping_offset_starobinsky_Nstar60]

