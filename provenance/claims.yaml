  - id: endpoint-and-tilt-resolution
    statement: >
      Ocho extremos admiten arranques q=300,1000, parada q=1e-4, refinamiento e integrador
      independiente; ocho índices a N*=50,60 se cotejan con pasos 0.5,0.25,0.125.
      Los criterios son exploratorios; no se verifica toda la tabla de radiación con Q.
    evidence:
